<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Lens visualization centered -->
  <g transform="translate(600, 280)" filter="drop-shadow(0 8px 32px rgba(99, 102, 241, 0.4))">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="100" stroke="url(#ringGradient)" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="70" stroke="url(#ringGradient)" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="40" stroke="url(#ringGradient)" stroke-width="3" fill="none" opacity="0.9"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="16" fill="url(#ringGradient)"/>
    <!-- Light rays -->
    <g stroke="#6366f1" stroke-width="2" opacity="0.5">
      <line x1="0" y1="-140" x2="0" y2="-180"/>
      <line x1="0" y1="140" x2="0" y2="180"/>
      <line x1="-140" y1="0" x2="-180" y2="0"/>
      <line x1="140" y1="0" x2="180" y2="0"/>
      <line x1="-99" y1="-99" x2="-127" y2="-127"/>
      <line x1="99" y1="99" x2="127" y2="127"/>
      <line x1="-99" y1="99" x2="-127" y2="127"/>
      <line x1="99" y1="-99" x2="127" y2="-127"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">
    OneLens by Ruchi
  </text>
  
  <!-- Tagline -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#c7d2fe">
    One lens. Every framework.
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#93c5fd">
    Map a control once. See everywhere it counts.
  </text>
</svg>