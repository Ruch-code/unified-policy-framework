<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer lens ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#lensGradient)" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <!-- Inner aperture -->
  <circle cx="24" cy="24" r="14" fill="url(#lensGradient)" opacity="0.15"/>
  <!-- Focus indicator -->
  <path d="M24 10 V14 M24 34 V38 M10 24 H14 M34 24 H38" stroke="url(#lensGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="3" fill="url(#lensGradient)"/>
  <!-- Focus lines suggesting convergence -->
  <g stroke="url(#lensGradient)" stroke-width="0.8" opacity="0.3">
    <line x1="24" y1="14" x2="20" y2="18"/>
    <line x1="24" y1="14" x2="28" y2="18"/>
    <line x1="24" y1="34" x2="20" y2="30"/>
    <line x1="24" y1="34" x2="28" y2="30"/>
    <line x1="14" y1="24" x2="18" y2="20"/>
    <line x1="14" y1="24" x2="18" y2="28"/>
    <line x1="34" y1="24" x2="30" y2="20"/>
    <line x1="34" y1="24" x2="30" y2="28"/>
  </g>
</svg>