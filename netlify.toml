[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_PASSWORD,MONGODB_URI,JWT_SECRET,DEFAULT_USER_PASSWORD,GEMINI_API_KEY"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 200
